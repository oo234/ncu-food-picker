<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央今天吃什麼？</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 新增：左側選單按鈕 -->
    <button id="toggleLeftMenuBtn">☰</button>

    <!-- 新增：左側可拉式選單面板 -->
    <div id="leftMenu" class="leftMenu">
        <!-- 新增：頂部標題區塊，用來裝 NCU 和 ✕ -->
        <div class="leftMenu-header">
            <span class="leftMenu-logo">NCU</span>
            <button id="closeLeftMenuBtn">✕</button>
        </div>
        <ul class="menu-list">
            <li><a href="#">🏠 首頁 (中央吃什麼)</a></li>
            <li><a href="#">📋 附近餐廳地圖</a></li>
            <li><a href="#">⚙️ 系統設定</a></li>
        </ul>
    </div>

    <button id="togglePanelBtn">⚙️</button>

    <h1 id="title">今天吃什麼？(中央)</h1>
    <p></p>

    <!-- 抽籤方式：現代膠囊切換 -->
    <div id="drawMethodSelector" class="modern-selector">
        <input type="radio" id="method-basic" name="drawMethod" value="basic" checked>
        <label for="method-basic" class="selector-item">🎲 基礎秒抽</label>

        <input type="radio" id="method-roulette" name="drawMethod" value="roulette">
        <label for="method-roulette" class="selector-item">🎡 幸運轉盤</label>

        <input type="radio" id="method-gacha" name="drawMethod" value="gacha">
        <label for="method-gacha" class="selector-item">🎁 驚喜扭蛋</label>

        <div class="slider"></div>
    </div>

    <button id="pickButton">開始抽！</button>

    <div class="container">
        <div class="leftPanel"></div>
        <div class="mainContent">
            <div id="result">
                還沒有抽餐廳
            </div>
        </div>

        <div class="restaurantPanel">
            <!-- 新增：右側面板頂部排版 -->
            <div class="panel-header">
                <span class="panel-title">🍴 篩選餐廳</span>
                <button id="closePanelBtn">✕</button>
            </div>
            
            <!-- 新增：地點選擇器 -->
            <div id="locationSelector" style="margin-bottom: 15px; text-align: left; padding-left: 10px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">📍 選擇地點</label>
                <select id="locationSelect" style="width: 90%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;">
                    <option value="all">全地點</option>
                    <option value="後門">後門</option>
                    <option value="宵夜街">宵夜街</option>
                    <option value="松果餐廳">松果餐廳</option>
                    <option value="女14舍">女14舍</option>
                    <option value="第九餐廳">第九餐廳</option>
                    <option value="松苑餐廳">松苑餐廳</option>
                    <option value="小木屋鬆餅">小木屋鬆餅</option>
                </select>
            </div>

            <!-- 時段選擇器 -->
            <div id="timeSlotSelector" style="margin-bottom: 15px; text-align: left; padding-left: 10px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">⏰ 選擇時段</label>
                <label style="margin-right: 10px;"><input type="radio" name="timeSlot" value="none" checked> 全時段</label>
                <label style="margin-right: 10px;"><input type="radio" name="timeSlot" value="lunch"> 午餐</label>
                <label><input type="radio" name="timeSlot" value="dinner"> 晚餐</label>
            </div>

            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">

            <button id="selectAll">全部選取</button>
            <button id="unselectAll">全部取消</button>
            <div id="restaurantCheckboxes"></div>
        </div>
    </div>

    <div id="lightbox">
        <img id="lightboxImage">
    </div>

    <script src="script.js"></script>
</body>
</html>
