<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中央今天吃什麼？</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==============================
         左側選單 (導覽列)
         ============================== -->
    <button id="toggleLeftMenuBtn">☰</button>
    <div id="leftMenu" class="leftMenu">
        <div class="leftMenu-header">
            <span class="leftMenu-logo">NCU</span>
            <button id="closeLeftMenuBtn">✕</button>
        </div>
        <ul class="menu-list">
            <li><a href="#">🏠 首頁 (中央吃什麼)</a></li>
            <li><a href="#">📋 附近餐廳地圖</a></li>
            <li><a href="#">⚙️ 系統設定</a></li>
        </ul>
    </div>

    <!-- ==============================
         主畫面標題與抽籤方式切換
         ============================== -->
    <button id="togglePanelBtn">⚙️</button>
    <h1 id="title">今天吃什麼？(中央)</h1>
    
    <div id="drawMethodSelector" class="modern-selector">
        <input type="radio" id="method-basic" name="drawMethod" value="basic" checked>
        <label for="method-basic" class="selector-item">🎲 基礎</label>

        <input type="radio" id="method-roulette" name="drawMethod" value="roulette">
        <label for="method-roulette" class="selector-item">🎡 轉盤</label>

        <input type="radio" id="method-gacha" name="drawMethod" value="gacha">
        <label for="method-gacha" class="selector-item">🎁 扭蛋</label>

        <div class="slider"></div>
    </div>

    <button id="pickButton">開始抽！</button>

    <!-- ==============================
         主要內容佈局 (結果卡片與右側面板)
         ============================== -->
    <div class="container">
        <div class="leftPanel"></div>
        
        <!-- 抽籤結果顯示區 -->
        <div class="mainContent">
            <div id="result">
                還沒有抽餐廳
            </div>

            <!-- 動態地圖顯示區塊 (預設隱藏) -->
            <div id="mapContainer" style="display: none; width: 90%; max-width: 800px; margin: 20px auto; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: white;">
                <!-- 這是用來裝 Leaflet 地圖的空盒子，設定好高度 -->
                <div id="map" style="width: 100%; height: 500px; z-index: 1;"></div>
                
                <button onclick="backToDraw()" style="margin: 15px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">返回抽籤</button>
            </div>
        </div>

        <!-- 右側篩選面板 -->
        <div class="restaurantPanel">
            <div class="panel-header">
                <span class="panel-title">篩選餐廳</span>
                <button id="closePanelBtn">✕</button>
            </div>

            <!-- 篩選：地點 -->
            <div class="filter-section">
                <label class="filter-label">選擇地點</label>
                <select id="locationSelector" onchange="updatePreview()">
                    <option value="all">全地點</option>
                    <option value="後門">後門</option>
                    <option value="宵夜街">宵夜街</option>
                    <option value="松果餐廳">松果餐廳</option>
                    <option value="女14舍">女14舍</option>
                    <option value="第九餐廳">第九餐廳</option>
                    <option value="松苑餐廳">松苑餐廳</option>
                    <option value="小木屋鬆餅">小木屋鬆餅</option>
                </select>
            </div>

            <!-- 篩選：時段 -->
            <div class="filter-section">
                <label class="filter-label">選擇時段</label>
                <div class="sliding-segmented-control">
                    <input type="radio" id="time-all" name="timeSlot" value="all" onchange="updatePreview()" checked>
                    <label for="time-all">全時段</label>

                    <input type="radio" id="time-lunch" name="timeSlot" value="lunch" onchange="updatePreview()">
                    <label for="time-lunch">午餐</label>

                    <input type="radio" id="time-dinner" name="timeSlot" value="dinner" onchange="updatePreview()">
                    <label for="time-dinner">晚餐</label>

                    <div class="slide-indicator"></div>
                </div>
            </div>

            <!-- 篩選：我的最愛 -->
            <div class="filter-section">
                <div class="toggle-section">
                    <div class="toggle-text-group">
                        <label class="filter-label" style="margin-bottom: 0;">我的最愛</label>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="onlyFavorites" onchange="toggleFavList()">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div id="favoritesList" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; line-height: 1.8;"></div>
            </div>
            
            <hr class="filter-divider">
            
            <!-- 全選與取消按鈕 -->
            <div class="filter-actions">
                <button id="selectAllBtn" class="action-btn">全部選取</button>
                <button id="deselectAllBtn" class="action-btn outline">全部取消</button>
            </div>

            <!-- 餐廳動態列表容器 -->
            <div id="restaurantCheckboxes" style="text-align: left; padding-left: 5px; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- ==============================
         圖片放大燈箱
         ============================== -->
    <div id="lightbox">
        <img id="lightboxImage">
    </div>

    <script src="script.js"></script>
</body>
</html>
