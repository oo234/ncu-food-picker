<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <!-- 設定網頁使用 UTF-8 編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁在手機、平板上可以自動縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 瀏覽器分頁上顯示的名稱 -->
    <title>中央今天吃什麼？</title>

    <!-- 引入 style.css，負責網頁外觀 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 網頁的大標題 -->
    <h1 id="title">🍔 中央今天吃什麼？</h1>

    <!-- 網頁說明文字 -->
    <p>今天不知道要吃什麼嗎？讓我幫你決定！</p>

    <!-- 按鈕
            id="pickButton" 是按鈕的名字
            JavaScript 之後會透過這個 id 找到按鈕 -->
    <button id="pickButton">開始抽！</button>

    <div class="container">

        <!-- 左側 -->
        <div class="leftPanel">

        </div>

        <!-- 中間 -->
        <div class="mainContent">

            <div id="result">
                還沒有抽餐廳
            </div>

        </div>

        <!-- 右側 -->
        <div class="restaurantPanel">

            <h3>🍴 選擇餐廳</h3>


            <button id="selectAll">
                全部選取
            </button>


            <button id="unselectAll">
                全部取消
            </button>


            <div id="restaurantCheckboxes"></div>

        </div>

    </div>

    <!-- ==============================
        Lightbox 圖片放大視窗
        平常隱藏，點圖片才出現
        ============================== -->

    <div id="lightbox">
        <!-- 大圖片 -->
        <img id="lightboxImage">
    </div>

    <!-- 引入 JavaScript -->
    <script src="script.js"></script>

</body>

</html>
